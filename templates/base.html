<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Trading Autopilot{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=why4">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a href="/" class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-text">Autopilot</div>
          <div class="brand-sub">AI portfolio manager</div>
        </div>
      </a>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-label">Portfolio</div>
          <a href="/" class="nav-item {% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
          <a href="/performance" class="nav-item {% if active == 'performance' %}active{% endif %}">Performance</a>
          <a href="/history" class="nav-item {% if active == 'history' %}active{% endif %}">History</a>
          <a href="/memory" class="nav-item {% if active == 'memory' %}active{% endif %}">Memory</a>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">System</div>
          <a href="/settings" class="nav-item {% if active == 'settings' %}active{% endif %}">Guardrails</a>
          <a href="/usage" class="nav-item {% if active == 'usage' %}active{% endif %}">AI usage</a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <div class="main-inner">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script src="/static/js/app.js?v=why4"></script>
</body>
</html>
